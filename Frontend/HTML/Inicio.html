<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookVerse - Tu Librería Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../CSS/Inicio.css">
    <link rel="stylesheet" href="../CSS/resultadoLibro.css">
     <link rel="stylesheet" href="../CSS/sidebar.css">


</head>
<body>
    <!-- Header -->
    <header>
        <nav class="container">
              <div class="logo">BookVerse</div>
              <div class="header-search-wrapper">
                  <div class="search-bar header-search">
                      <input type="text" id="search-input" placeholder="Busca tu libro favorito...">

                      <div class="genre-filter-wrapper">
                          <button id="genre-toggle" class="genre-toggle" aria-expanded="false">Todos los géneros <i class="fas fa-chevron-down"></i></button>
                          <div id="genre-panel" class="genre-panel" hidden>
                              <div id="genre-list" class="genre-list"></div>
                          </div>
                          <div id="genre-chips" class="genre-chips"></div>
                      </div>

                      <div class="price-filters">
                          <input type="text" id="min-price" class="price-input" placeholder="Min">
                          <input type="text" id="max-price" class="price-input" placeholder="Max">
                      </div>

                      <button class="search-btn" onclick="searchBooks()">Buscar</button>
                  </div>
              </div>

              <div class="header-actions">
                 <button class="account-btn active" onclick="goMiCuenta()">
                     <i class="fas fa-user-circle"></i> Mi Cuenta
                 </button>

                 <button class="account-btn active" onclick="logout()">
                     <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                 </button>
              </div>
           </nav>
    </header>



    <!-- Sidebar -->
<div id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <h3>BookVerse</h3>
        <button class="close-btn" onclick="toggleSidebar()">×</button>
    </div>
    <div id="sidebar-profile" class="sidebar-profile"></div>
    <div class="sidebar-menu">
        <button class="sidebar-tab active" onclick="showSection('cart')"> <i class="fas fa-shopping-cart"></i> Carrito (<span id="sidebar-cart-count">0</span>)</button>
        <button class="sidebar-tab" onclick="logout()"> <i class="fas fa-sign-out-alt"></i> Salir</button>
    </div>
    <div class="sidebar-content">
        <div id="cart-section" class="section active">
            <h3>🛒 Tu Carrito</h3>
            <div id="cart-items">Tu carrito está vacío.</div>
            <button id="clear-cart-btn" onclick="clearCart()" style="display: none; margin-top: 1rem; padding: 0.6rem 1rem; background: #c0392b; color: white; border: none; border-radius: 6px; cursor: pointer;">
                🗑️ Vaciar carrito
            </button>
        </div>

     

        <!-- Sección Salir (no necesita contenido, redirige o limpia sesión) -->
        <div id="logout-section" class="section">
            <!-- Vacío, se maneja con JS -->
        </div>
    </div>
</div>

<!-- Overlay oscuro cuando sidebar está abierto -->
<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- Hero Section -->
    <section class="hero" id="home">
    <div class="container">
        <h1>Descubre Tu Próxima Aventura</h1>
        <div class="results-meta">
            <span id="results-count" class="results-count"></span>
        </div>

       
        <div id="resultado" class="books-container"></div>
    </div>
</section>

<!-- Modal -->
<div id="bookModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <div class="modal-body">
            <img id="modalImage" src="" alt="Portada del libro" class="modal-image">
            <div class="modal-info">
                <h2 id="modalTitle"></h2>
                <p id="modalAuthor" class="modal-author"></p>
                <p id="modalPrice" class="modal-price"></p>
                <p id="modalDescription" class="modal-description"></p>
                <div style="display:flex;gap:8px;margin-top:8px;">
                    <button id="modal-add-btn" class="btn modal-btn">🛒 Añadir al carrito</button>
                </div>
            </div>
        </div>
    </div>
</div>

    <!-- Books Section removed: books render in main results area -->

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>Mi Carrito</h3>
            <button class="close-cart" onclick="toggleCart()">×</button>
        </div>
        <div class="cart-items" id="cart-items">
            <p style="text-align: center; color: #666; padding: 2rem;">Tu carrito está vacío</p>
        </div>
        <div class="cart-total" id="cart-total">
            Total: $0
        </div>
        <button class="checkout-btn" onclick="checkout()">Proceder al Pago</button>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="toggleCart()"></div>

    <!-- Notification -->
    <div class="notification" id="notification">
        ¡Libro agregado al carrito!
    </div>

   

    <div id="toast-container"></div>

    <!-- Logout Confirmation Modal -->
    <div id="logout-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-sign-out-alt"></i> Cerrar sesión</h3>
                <span class="close" id="logout-modal-close">&times;</span>
            </div>
            <div class="modal-body">
                <p>¿Estás seguro de que quieres cerrar sesión?</p>
            </div>
            <div class="modal-footer" style="display:flex; gap:8px; justify-content:flex-end;">
                <button class="btn-secondary" onclick="cancelLogout()">Cancelar</button>
                <button class="btn-danger" onclick="confirmLogout()">Cerrar sesión</button>
            </div>
        </div>
    </div>

    <script src="../JS/Inicio.js"></script>
</body>
</html>
