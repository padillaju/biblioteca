<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Restablecer contraseña</title>

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- MISMO CSS DEL LOGIN -->
  <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>

  <div class="login-card">
    <h2>Nueva contraseña</h2>

    <form onsubmit="event.preventDefault(); cambiarPassword();">

      <!-- Nueva contraseña -->
      <div class="input-group">
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="password" placeholder="Nueva contraseña" required>
        <button type="button" class="toggle-pass" onclick="togglePass('password', this)">
          <i class="fa-solid fa-eye"></i>
        </button>
      </div>

      <!-- Confirmar contraseña -->
      <div class="input-group">
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" required>
        <button type="button" class="toggle-pass" onclick="togglePass('confirmPassword', this)">
          <i class="fa-solid fa-eye"></i>
        </button>
      </div>

      <button type="submit" id="loginBtn">Guardar</button>

    </form>

    <!-- Mensaje -->
    <div id="mensaje"></div>

    <!-- Volver -->
    <div class="forgot-password-container">
      <button type="button" class="forgot-password-btn" onclick="window.location.href='login.html'">
        Volver al inicio de sesión
      </button>
    </div>

  </div>

  <script src="../JS/restablecerPass.js"></script>


</body>
</html>
