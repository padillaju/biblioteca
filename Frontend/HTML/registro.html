<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <link rel="stylesheet" href="../CSS/registro.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>
  <div class="registro-container">
    <div class="titulo">
      <h2>Registro de Usuario</h2>
    </div>

    <form id="formRegistro" novalidate>
      <div class="input-group">
  <i class="fa-solid fa-user input-icon"></i>
  <input type="text" id="nombre" placeholder="Nombre completo" required>
  <small class="field-error" id="nombre-error"></small>
</div>

<div class="input-group">
  <i class="fa-solid fa-envelope input-icon"></i>
  <input type="email" id="correo" placeholder="Correo electrónico" required>
  <small class="field-error" id="correo-error"></small>
</div>

<div class="input-group">
  <i class="fa-solid fa-lock input-icon"></i>
  <input type="password" id="contrasena" placeholder="Contraseña" required>
  <small class="field-error" id="contrasena-error"></small>
</div>

<div class="input-group">
  <i class="fa-solid fa-phone input-icon"></i>
  <input type="text" id="celular" placeholder="Número de celular" required>
  <small class="field-error" id="celular-error"></small>
</div>

<div class="input-group">
  <i class="fa-solid fa-location-dot input-icon"></i>
  <input type="text" id="direccion" placeholder="Dirección completa" required>
  <small class="field-error" id="direccion-error"></small>
</div>

      <button type="submit">Registrar</button>
      <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
    </form>
    <div id="mensaje" role="alert" aria-live="polite"></div>
  </div>

  <script src="../JS/registro.js"></script>
</body>
</html>
