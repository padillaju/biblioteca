<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Meta tags para prevenir caché después del logout -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../CSS/login.css">

</head>
<body>
  <div class="login-card">
    <h2>Iniciar Sesión</h2>
    <form id="formLogin" novalidate>
      <div class="input-group">
        <i class="fa-solid fa-envelope input-icon"></i>
        <input type="email" id="correo" placeholder="Correo electrónico" required aria-label="Correo">
        <small class="field-error" id="correo-error" aria-hidden="true"></small>
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="contrasena" placeholder="Contraseña" required aria-label="Contraseña">
        <button type="button" id="togglePassword" class="toggle-pass" aria-label="Mostrar contraseña"><i class="fa-solid fa-eye"></i></button>
        <small class="field-error" id="contrasena-error" aria-hidden="true"></small>
      </div>

      <button type="submit" id="loginBtn">Entrar</button>
    </form>

    <div class="switch-link" aria-hidden="false">¿No tienes cuenta? <a href="/">Regístrate</a></div>

    <div id="mensaje" role="alert" aria-live="polite"></div>
  </div>

  <script src="../JS/login.js"></script>
</body>
</html>
